<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Food Snap Estimator</title>
<style>
  body { margin: 0; background: #fafaf8; color: #1f1f1d; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; justify-content: center; }
  main { width: 100%; max-width: 480px; padding: 24px 20px 40px; box-sizing: border-box; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p.sub { color: #6b6b66; margin: 0 0 24px; font-size: 0.95rem; }
  #preview { width: 100%; border-radius: 10px; display: none; margin-bottom: 16px; max-height: 320px; object-fit: cover; }
  .pick-row { display: flex; gap: 10px; margin-bottom: 16px; }
  label.pick { flex: 1; display: block; text-align: center; padding: 16px 8px; border: 2px dashed #e4e2dc; border-radius: 10px; color: #6b6b66; cursor: pointer; }
  input[type="file"] { display: none; }
  button { width: 100%; padding: 14px; font-size: 1rem; border: none; border-radius: 10px; background: #3b6e4f; color: white; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  #result { margin-top: 24px; background: #fff; border: 1px solid #e4e2dc; border-radius: 10px; padding: 18px; display: none; }
  .field { display: block; margin-bottom: 12px; }
  .field span { display: block; font-size: 0.85rem; color: #6b6b66; margin-bottom: 4px; }
  .field input, .field select { width: 100%; box-sizing: border-box; padding: 10px; font-size: 1rem; border: 1px solid #e4e2dc; border-radius: 8px; background: #fff; color: inherit; }
  .field input.name { font-size: 1.1rem; font-weight: 600; }
  .two { display: flex; gap: 10px; }
  .two .field { flex: 1; }
  .range { font-size: 0.8rem; color: #6b6b66; margin-top: 4px; }
  .confidence { margin: 4px 0 16px; font-size: 0.9rem; color: #6b6b66; font-style: italic; }
  .items { margin: 0 0 14px; border: 1px solid #e4e2dc; border-radius: 8px; overflow: hidden; }
  .items-title { font-size: 0.85rem; color: #6b6b66; margin-bottom: 4px; }
  .item { display: flex; justify-content: space-between; gap: 10px; padding: 8px 10px; border-bottom: 1px solid #e4e2dc; font-size: 0.92rem; }
  .item:last-child { border-bottom: none; }
  .item .portion { display: block; font-size: 0.8rem; color: #6b6b66; }
  .item .nums { text-align: right; white-space: nowrap; color: #3b3b37; }
  .item.total { background: #f3f2ee; font-weight: 600; }
  textarea { width: 100%; box-sizing: border-box; padding: 10px; font-size: 1rem; font-family: inherit; border: 1px solid #e4e2dc; border-radius: 8px; resize: vertical; min-height: 64px; color: inherit; background: #fff; }
  button.secondary { background: #fff; color: #3b6e4f; border: 1.5px solid #3b6e4f; margin-bottom: 18px; }
  hr { border: none; border-top: 1px solid #e4e2dc; margin: 4px 0 16px; }
  #status, #saveStatus { margin-top: 12px; font-size: 0.9rem; color: #6b6b66; text-align: center; }
  #saveStatus a { color: #3b6e4f; }
</style>
</head>
<body>
<main>
  <h1>Food Snap Estimator</h1>
  <p class="sub">Snap or upload a photo. AI estimates the food, calories, and protein.</p>

  <img id="preview" alt="Selected food preview">

  <div class="pick-row">
    <label class="pick">
      📷 Take photo
      <input type="file" id="cameraInput" accept="image/*" capture="environment">
    </label>
    <label class="pick">
      🖼️ Choose from gallery
      <input type="file" id="galleryInput" accept="image/*">
    </label>
  </div>

  <button id="analyzeBtn" disabled>Analyze photo</button>
  <div id="status"></div>

  <div id="result">
    <label class="field">
      <span>Food</span>
      <input id="foodName" class="name" type="text">
    </label>
    <div class="items-title">What's on the plate</div>
    <div class="items" id="items"></div>
    <label class="field">
      <span>Missing something or wrong portion? Add details and re-analyze</span>
      <textarea id="userNotes" placeholder="e.g. also a fried egg and a bowl of soup; rice is about 1.5 cups"></textarea>
    </label>
    <button id="reanalyzeBtn" class="secondary">Re-analyze with my details</button>
    <hr>
    <div class="two">
      <label class="field">
        <span>Calories (kcal)</span>
        <input id="caloriesKcal" type="number" inputmode="numeric" min="0">
        <div class="range" id="caloriesRange"></div>
      </label>
      <label class="field">
        <span>Protein (g)</span>
        <input id="proteinG" type="number" inputmode="decimal" min="0" step="0.1">
        <div class="range" id="proteinRange"></div>
      </label>
    </div>
    <label class="field">
      <span>Meal</span>
      <select id="meal">
        <option>Breakfast</option>
        <option>Lunch</option>
        <option>Dinner</option>
        <option>Snack</option>
      </select>
    </label>
    <p class="confidence" id="confidence"></p>
    <button id="saveBtn">Save to log</button>
    <div id="saveStatus"></div>
  </div>
</main>

<script>
  const cameraInput = document.getElementById('cameraInput');
  const galleryInput = document.getElementById('galleryInput');
  const preview = document.getElementById('preview');
  const analyzeBtn = document.getElementById('analyzeBtn');
  const saveBtn = document.getElementById('saveBtn');
  const reanalyzeBtn = document.getElementById('reanalyzeBtn');
  const statusEl = document.getElementById('status');
  const saveStatusEl = document.getElementById('saveStatus');
  const resultEl = document.getElementById('result');
  const $ = id => document.getElementById(id);

  let selectedFile = null;   // photo sent for analysis and saved to the log
  let lastResult = null;     // AI result, for the range/notes fields

  // Shrink photos before upload: faster on mobile data and fits Notion's
  // 5 MB free-plan limit. Falls back to the original if the browser can't decode it.
  async function shrinkPhoto(file, maxSide = 1280) {
    try {
      const bitmap = await createImageBitmap(file);
      const scale = Math.min(1, maxSide / Math.max(bitmap.width, bitmap.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(bitmap.width * scale);
      canvas.height = Math.round(bitmap.height * scale);
      canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.85));
      if (!blob) return file;
      return new File([blob], 'meal.jpg', { type: 'image/jpeg' });
    } catch (err) {
      console.warn('[warn] could not shrink photo, using original', err);
      return file;
    }
  }

  function defaultMeal() {
    const h = new Date().getHours();
    if (h >= 5 && h < 11) return 'Breakfast';
    if (h >= 11 && h < 15) return 'Lunch';
    if (h >= 17 && h < 22) return 'Dinner';
    return 'Snack';
  }

  // Local time with timezone offset, so Notion shows the time you ate
  function localIsoNow() {
    const d = new Date();
    const pad = n => String(Math.abs(n)).padStart(2, '0');
    const off = -d.getTimezoneOffset();
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}` +
      `${off >= 0 ? '+' : '-'}${pad(Math.trunc(off / 60))}:${pad(off % 60)}`;
  }

  async function onFileChosen(input) {
    const file = input.files[0];
    input.value = ''; // allow picking the same photo again
    if (!file) return;
    console.log('[step] file selected', file.name, file.type, file.size);

    preview.src = URL.createObjectURL(file);
    preview.style.display = 'block';
    resultEl.style.display = 'none';
    statusEl.textContent = '';
    analyzeBtn.disabled = true;

    selectedFile = await shrinkPhoto(file);
    console.log('[step] photo ready', selectedFile.type, selectedFile.size);
    analyzeBtn.disabled = false;
  }

  cameraInput.addEventListener('change', () => onFileChosen(cameraInput));
  galleryInput.addEventListener('change', () => onFileChosen(galleryInput));

  function renderItems(items, totalKcal, totalProtein) {
    const box = $('items');
    box.innerHTML = '';
    const row = (name, portion, nums, cls) => {
      const div = document.createElement('div');
      div.className = 'item' + (cls ? ' ' + cls : '');
      const left = document.createElement('div');
      left.textContent = name;
      if (portion) {
        const p = document.createElement('span');
        p.className = 'portion';
        p.textContent = portion;
        left.append(p);
      }
      const right = document.createElement('div');
      right.className = 'nums';
      right.textContent = nums;
      div.append(left, right);
      box.append(div);
    };
    (items || []).forEach(i => row(i.name, i.portion, `${Math.round(i.calories_kcal)} kcal · ${i.protein_g} g`));
    row('Total', '', `${totalKcal ?? '?'} kcal · ${totalProtein ?? '?'} g`, 'total');
  }

  // Plain-text breakdown saved to the Notion "Items" column
  function itemsAsText(items) {
    return (items || []).map(i => `• ${i.name} (${i.portion}): ${Math.round(i.calories_kcal)} kcal, ${i.protein_g} g protein`).join('\n');
  }

  async function runAnalysis(userNotes) {
    if (!selectedFile) return;
    analyzeBtn.disabled = true;
    reanalyzeBtn.disabled = true;
    statusEl.textContent = userNotes ? 'Re-analyzing with your details...' : 'Analyzing photo...';
    if (!userNotes) resultEl.style.display = 'none';
    console.log('[step] uploading photo to /api/analyze', userNotes ? '(with notes)' : '');

    const formData = new FormData();
    formData.append('photo', selectedFile);
    if (userNotes) formData.append('user_notes', userNotes);

    try {
      const response = await fetch('/api/analyze', { method: 'POST', body: formData });
      const parsed = await response.json();
      console.log('[step] server responded', parsed);

      if (parsed.error) throw new Error(parsed.error);

      lastResult = parsed;
      lastResult.user_notes = userNotes || '';
      $('foodName').value = parsed.food_name || '';
      renderItems(parsed.items, parsed.calories_kcal, parsed.protein_g);
      $('caloriesKcal').value = parsed.calories_kcal ?? '';
      $('proteinG').value = parsed.protein_g ?? '';
      $('caloriesRange').textContent = parsed.calories ? 'AI range: ' + parsed.calories : '';
      $('proteinRange').textContent = parsed.protein ? 'AI range: ' + parsed.protein : '';
      if (!userNotes) {
        $('meal').value = defaultMeal();
        $('userNotes').value = '';
      }
      $('confidence').textContent = parsed.confidence_note || '';
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save to log';
      saveStatusEl.textContent = '';
      resultEl.style.display = 'block';
      statusEl.textContent = '';
      if (userNotes) $('items').scrollIntoView({ behavior: 'smooth', block: 'center' });
    } catch (err) {
      console.error('[error]', err);
      statusEl.textContent = 'Error: ' + err.message;
      if (userNotes) statusEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    } finally {
      analyzeBtn.disabled = false;
      reanalyzeBtn.disabled = false;
    }
  }

  analyzeBtn.addEventListener('click', () => runAnalysis(''));
  reanalyzeBtn.addEventListener('click', () => {
    const notes = $('userNotes').value.trim();
    if (!notes) {
      $('userNotes').focus();
      return;
    }
    runAnalysis(notes);
  });

  saveBtn.addEventListener('click', async () => {
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving...';
    saveStatusEl.textContent = '';

    const formData = new FormData();
    if (selectedFile) formData.append('photo', selectedFile);
    formData.append('food_name', $('foodName').value.trim());
    formData.append('calories_kcal', $('caloriesKcal').value);
    formData.append('protein_g', $('proteinG').value);
    formData.append('calories', lastResult?.calories || '');
    formData.append('protein', lastResult?.protein || '');
    formData.append('items', itemsAsText(lastResult?.items));
    formData.append('notes', [lastResult?.user_notes && 'My details: ' + lastResult.user_notes, lastResult?.confidence_note].filter(Boolean).join('\n'));
    formData.append('meal', $('meal').value);
    formData.append('eaten_at', localIsoNow());

    try {
      const response = await fetch('/api/log', { method: 'POST', body: formData });
      const data = await response.json();
      if (data.error) throw new Error(data.error);
      saveBtn.textContent = 'Saved ✓';
      saveStatusEl.innerHTML = '';
      const link = document.createElement('a');
      link.href = data.url;
      link.target = '_blank';
      link.textContent = 'Open in Notion';
      saveStatusEl.append(link);
    } catch (err) {
      console.error('[error]', err);
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save to log';
      saveStatusEl.textContent = 'Error: ' + err.message;
    }
  });
</script>
</body>
</html>
