<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Food Snap Estimator</title>
<style>
  body { margin: 0; background: #fafaf8; color: #1f1f1d; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; justify-content: center; }
  main { width: 100%; max-width: 480px; padding: 24px 20px 40px; box-sizing: border-box; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p.sub { color: #6b6b66; margin: 0 0 24px; font-size: 0.95rem; }
  #preview { width: 100%; border-radius: 10px; display: none; margin-bottom: 16px; max-height: 320px; object-fit: cover; }
  .pick-row { display: flex; gap: 10px; margin-bottom: 16px; }
  label.pick { flex: 1; display: block; text-align: center; padding: 16px 8px; border: 2px dashed #e4e2dc; border-radius: 10px; color: #6b6b66; cursor: pointer; }
  input[type="file"] { display: none; }
  button { width: 100%; padding: 14px; font-size: 1rem; border: none; border-radius: 10px; background: #3b6e4f; color: white; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  #result { margin-top: 24px; background: #fff; border: 1px solid #e4e2dc; border-radius: 10px; padding: 18px; display: none; }
  #result h2 { margin: 0 0 12px; font-size: 1.15rem; }
  .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #e4e2dc; }
  .row:last-of-type { border-bottom: none; }
  .row span:first-child { color: #6b6b66; }
  .confidence { margin-top: 12px; font-size: 0.9rem; color: #6b6b66; font-style: italic; }
  #status { margin-top: 12px; font-size: 0.9rem; color: #6b6b66; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>Food Snap Estimator</h1>
  <p class="sub">Snap or upload a photo. AI estimates the food, calories, and protein.</p>

  <img id="preview" alt="Selected food preview">

  <div class="pick-row">
    <label class="pick">
      📷 Take photo
      <input type="file" id="cameraInput" accept="image/*" capture="environment">
    </label>
    <label class="pick">
      🖼️ Choose from gallery
      <input type="file" id="galleryInput" accept="image/*">
    </label>
  </div>

  <button id="analyzeBtn" disabled>Analyze photo</button>
  <div id="status"></div>

  <div id="result">
    <h2 id="foodName"></h2>
    <div class="row"><span>Calories</span><span id="calories"></span></div>
    <div class="row"><span>Protein</span><span id="protein"></span></div>
    <p class="confidence" id="confidence"></p>
  </div>
</main>

<script>
  const cameraInput = document.getElementById('cameraInput');
  const galleryInput = document.getElementById('galleryInput');
  const preview = document.getElementById('preview');
  const analyzeBtn = document.getElementById('analyzeBtn');
  const statusEl = document.getElementById('status');
  const resultEl = document.getElementById('result');

  let selectedFile = null;

  function onFileChosen(input) {
    const file = input.files[0];
    input.value = ''; // allow picking the same photo again
    if (!file) return;
    console.log('[step] file selected', file.name, file.type, file.size);
    selectedFile = file;

    const reader = new FileReader();
    reader.onload = () => {
      preview.src = reader.result;
      preview.style.display = 'block';
      analyzeBtn.disabled = false;
      resultEl.style.display = 'none';
      statusEl.textContent = '';
    };
    reader.readAsDataURL(file);
  }

  cameraInput.addEventListener('change', () => onFileChosen(cameraInput));
  galleryInput.addEventListener('change', () => onFileChosen(galleryInput));

  analyzeBtn.addEventListener('click', async () => {
    if (!selectedFile) return;
    analyzeBtn.disabled = true;
    statusEl.textContent = 'Analyzing photo...';
    resultEl.style.display = 'none';
    console.log('[step] uploading photo to /api/analyze');

    const formData = new FormData();
    formData.append('photo', selectedFile);

    try {
      const response = await fetch('/api/analyze', { method: 'POST', body: formData });
      const parsed = await response.json();
      console.log('[step] server responded', parsed);

      if (parsed.error) throw new Error(parsed.error);

      document.getElementById('foodName').textContent = parsed.food_name;
      document.getElementById('calories').textContent = parsed.calories;
      document.getElementById('protein').textContent = parsed.protein;
      document.getElementById('confidence').textContent = parsed.confidence_note;
      resultEl.style.display = 'block';
      statusEl.textContent = '';
    } catch (err) {
      console.error('[error]', err);
      statusEl.textContent = 'Error: ' + err.message;
    } finally {
      analyzeBtn.disabled = false;
    }
  });
</script>
</body>
</html>
